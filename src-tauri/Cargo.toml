[package]
name = "taffy"
version = "0.1.0"
description = "A local-first learning retention app"
authors = ["taffy"]
edition = "2021"

[lib]
name = "taffy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "2"
